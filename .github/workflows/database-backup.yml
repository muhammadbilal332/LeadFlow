name: Database backup

# Dumps the LeadFlow Postgres database (schema `public` only — see
# scripts/backup/backup-database.sh for why) every 15 minutes and uploads it
# to a private Cloudflare R2 bucket. Independent of the outreach-tick.yml
# scheduler and of n8n; does not touch the unrelated Amazon LeadFlow project.
#
# IMPORTANT: GitHub's cron schedule is best-effort, not exact. Scheduled
# workflows can be delayed by several minutes (sometimes longer) under
# GitHub-wide load, and a repository with no activity for 60+ days has its
# scheduled workflows auto-disabled until someone opens the Actions tab.
# "Every 15 minutes" describes the trigger interval, not a guaranteed
# recovery-point objective — see docs/DATABASE_BACKUP_AND_RESTORE.md.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL      - the DIRECT (non-pooled) Postgres connection
#                           string, from Supabase: Project Settings ->
#                           Database -> Connection string -> URI (not the
#                           "Connection pooling" one — the app already uses
#                           the pooler for its own traffic; pg_dump should
#                           use a separate, direct connection so a backup
#                           run never competes with the app for pooler slots,
#                           which previously caused real request failures).
#   R2_ACCOUNT_ID         - Cloudflare account id
#   R2_ACCESS_KEY_ID      - R2 API token access key id (needs only
#                           read/write on the one backup bucket)
#   R2_SECRET_ACCESS_KEY  - R2 API token secret
#   R2_BUCKET_NAME        - the private R2 bucket dedicated to these backups
#
# Optional (for the Google Sheets secondary backup log — see
# docs/GOOGLE_SHEETS_BACKUP_LOGGING.md). If either is unset, that step is
# skipped entirely and the R2 backup above is completely unaffected:
#   GOOGLE_SERVICE_ACCOUNT_JSON  - single-line service-account key JSON
#   GOOGLE_SHEETS_SPREADSHEET_ID - the target spreadsheet's id
#
# The R2 backup's own schedule (above) is NEVER gated by working hours — it
# always runs every 15 minutes, unchanged. Only the secondary Google Sheets
# log is restricted to a configurable working window (default: 09:00-18:00
# UTC, Mon-Sat), via these optional repository VARIABLES (not secrets —
# they hold no sensitive data). See docs/GOOGLE_SHEETS_BACKUP_LOGGING.md:
#   SHEETS_SCHEDULE_TIMEZONE      - IANA timezone name, default "UTC"
#   SHEETS_SCHEDULE_WORKING_DAYS  - comma list, 1=Mon..7=Sun, default "1,2,3,4,5,6"
#   SHEETS_SCHEDULE_START_HOUR    - 0-23 local hour, default "9"
#   SHEETS_SCHEDULE_WORKING_HOURS - 1-24 hour duration, default "9"
# A manual workflow_dispatch run always logs to Sheets regardless of the
# window (useful for testing/emergency runs) — see scheduleGate.ts.
#
# See docs/DATABASE_BACKUP_AND_RESTORE.md for how to obtain/create each of
# these safely.
#
# Reliability contract: the R2 backup (the "Run backup" step) and the
# Google Sheets manifest log are independent. The Sheets step always runs
# (`if: always()`) and is never allowed to fail the job
# (`continue-on-error: true`) — a Sheets/Google outage must never mask or
# invalidate a successful R2 backup. The final "Finalize" step re-asserts
# the job's real result from the R2 backup step alone, so the job's
# overall pass/fail in the Actions UI always means "did the R2 backup
# succeed", never "did the Sheets log write succeed".

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: leadflow-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Installs a pg_dump/pg_restore client matching (or newer than) the
      # Supabase project's Postgres 17 server — pg_dump is only reliably
      # supported against a server the same age or older than the client.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Run backup
        id: backup
        continue-on-error: true
        run: bash scripts/backup/backup-database.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      # Secondary, human-readable log — entirely independent of the R2
      # backup above. Runs whether the backup succeeded or failed
      # (if: always()) and is never allowed to fail the job itself
      # (continue-on-error: true) or flip the job's real result; see the
      # Finalize step below. Skips itself (not an error) if the Google
      # secrets aren't configured yet.
      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Sheets logger dependencies
        if: always()
        continue-on-error: true
        working-directory: scripts/backup/sheets
        run: npm ci

      # Decides whether "now" falls inside the configured working window —
      # see scripts/backup/sheets/src/scheduleGate.ts. Does NOT decide
      # whether this run happens at all (the R2 backup above already ran
      # unconditionally); only gates the secondary Sheets log below. A
      # config error here is logged but never fails the job
      # (continue-on-error), and the following step's `if:` treats a
      # missing/errored decision the same as "outside the window" — fails
      # safe by skipping Sheets, never by blocking R2.
      - name: Check Sheets working-window schedule
        id: schedule_gate
        if: always()
        continue-on-error: true
        working-directory: scripts/backup/sheets
        run: npm run schedule-gate
        env:
          SHEETS_SCHEDULE_TIMEZONE: ${{ vars.SHEETS_SCHEDULE_TIMEZONE }}
          SHEETS_SCHEDULE_WORKING_DAYS: ${{ vars.SHEETS_SCHEDULE_WORKING_DAYS }}
          SHEETS_SCHEDULE_START_HOUR: ${{ vars.SHEETS_SCHEDULE_START_HOUR }}
          SHEETS_SCHEDULE_WORKING_HOURS: ${{ vars.SHEETS_SCHEDULE_WORKING_HOURS }}

      # Only runs inside the configured working window, OR on a manual
      # workflow_dispatch run (always logs, for testing/emergency use) —
      # the window never applies to a human-triggered run. Secret-presence
      # and idempotency checks inside logBackupManifest.ts still apply
      # regardless of trigger type, so this bypass never skips a safety
      # check, only the schedule gate itself.
      - name: Log backup manifest to Google Sheets
        if: always() && (github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.in_window == 'true')
        continue-on-error: true
        working-directory: scripts/backup/sheets
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GOOGLE_SHEETS_SPREADSHEET_ID" ]; then
            echo "Google Sheets secrets not configured — skipping the secondary backup log (R2 result above is unaffected)."
            exit 0
          fi
          npm run log-manifest
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          BACKUP_STATUS: ${{ steps.backup.outputs.status }}
          BACKUP_TIMESTAMP: ${{ steps.backup.outputs.timestamp }}
          BACKUP_OBJECT_KEY: ${{ steps.backup.outputs.object_key }}
          BACKUP_SIZE_BYTES: ${{ steps.backup.outputs.size_bytes }}
          BACKUP_SHA256: ${{ steps.backup.outputs.checksum }}
          BACKUP_DURATION_SECONDS: ${{ steps.backup.outputs.duration_seconds }}
          BACKUP_ERROR_SUMMARY: ${{ steps.backup.outputs.error_summary }}

      # Re-asserts the job's real outcome from the R2 backup step alone —
      # the two Sheets steps above used continue-on-error specifically so
      # they could never reach this point having silently failed the job.
      - name: Finalize (job result reflects the R2 backup only)
        if: always()
        run: |
          if [ "${{ steps.backup.outcome }}" != "success" ]; then
            echo "R2 backup step failed — failing the job (independent of Google Sheets logging result above)."
            exit 1
          fi
