[build]
  base = "client"
  command = "npm install && npm run build"
  publish = "dist"

# Single-page app: every route (e.g. /leads/123, /f/acme/contact-us) must
# serve index.html so React Router can handle it client-side, instead of
# Netlify 404ing on a direct load or refresh of a non-root path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
